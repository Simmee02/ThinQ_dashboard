<!-- VoC 분석 > 기간별 리뷰 추이 · market.html 의 OVERVIEW 표시 자리에 들어갑니다 -->
<div class="wrap" id="view-ov">



  <div class="grid">
    <section class="card" aria-label="기간 선택">
      <h2>기간 선택</h2>
      <div class="range" id="range"></div>
      <div class="presets" id="presets">
        <button id="p-7" data-p="7">최근 7일</button>
        <button id="p-30" data-p="30">최근 30일</button>
        <button id="p-90" data-p="90">최근 3개월</button>
      </div>
      <div class="cal-head">
        <button id="prev" aria-label="이전 달">‹</button>
        <b id="cal-title"></b>
        <button id="next" aria-label="다음 달">›</button>
      </div>
      <div class="cal" id="cal"></div>
      <div class="hint" id="hint"></div>
    </section>

    <section class="card" aria-label="리뷰 수와 평균 별점">
      <div class="chart-top">
        <div class="l">
          <h2>리뷰 수 / 평균 별점</h2>
          <div class="seg" role="group" aria-label="단위">
            <button id="g-day" data-g="day" aria-pressed="true">일</button>
            <button id="g-week" data-g="week" aria-pressed="false">주</button>
            <button id="g-month" data-g="month" aria-pressed="false">월</button>
          </div>
        </div>
        <div class="r">
          <div class="legend"><span><i class="sw" style="background:var(--bar)"></i>리뷰 수</span><span id="lg-line"><i class="ln2"></i>평균 별점</span></div>
        </div>
      </div>
      <div class="chart-box" id="line-box">
        <svg id="line" viewBox="0 0 680 320" role="img" aria-label="선택 기간의 리뷰 수와 평균 별점"></svg>
        <div class="tip" id="line-tip"></div>
      </div>
      <div class="caption" id="line-cap"></div>
    </section>
  </div>



</div>
