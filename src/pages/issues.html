<!-- 이슈보드 · #issues (칸반 보드 / 목록, 상세 Drawer 포함) -->
<div class="wrap" id="view-is" hidden>
  <div class="ph2">
    <div class="ttl"><h1>이슈보드</h1><p>조치가 필요한 이슈를 확인해보세요.</p></div>
    <span class="period"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>2026.09.01 – 09.30</span>
  </div>

  <div class="kpis2">
    <button class="kpi2 stat" data-q="need"><span class="k">조치 필요</span><span class="d">담당 조직의 확인이 필요한 이슈</span><span class="v" id="v-need"></span></button>
    <button class="kpi2 stat" data-q="new"><span class="k">신규 이슈</span><span class="d">최근 24시간 안에 새로 생긴 이슈</span><span class="v" id="v-new"></span></button>
    <button class="kpi2 stat" data-q="reopen"><span class="k">재발 이슈</span><span class="d">이슈 해결 처리 후 다시 발생한 이슈</span><span class="v" id="v-reopen"></span></button>
    <button class="kpi2 stat" data-q="orphan"><span class="k">담당자 미배정</span><span class="d">담당 부서, 담당자 배정이 필요한 이슈</span><span class="v" id="v-orphan"></span></button>
  </div>

  <section class="board" aria-label="이슈 관리 보드">
    <div class="bd-head">
      <div><h2>이슈 관리 보드</h2><p id="bd-sub">이슈 처리 현황을 확인하고, 관리해보세요.</p></div>
      <div class="bd-ctrls">
        <div class="vt" role="group" aria-label="보기 방식">
          <button data-v="board" aria-pressed="true">보드</button>
          <button data-v="list" aria-pressed="false">목록</button>
          <button data-v="timeline" aria-pressed="false">타임라인</button>
        </div>
        <label class="dept-f"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8.5V19l-4 2v-7.5Z"/></svg><select id="dept-sel" aria-label="담당 부서"></select></label>
      </div>
    </div>

    <div class="kb" id="kb"></div>

    <div class="tw" id="list-wrap" hidden><table class="it">
      <thead><tr><th>#</th><th>이슈</th><th>판정</th><th>담당 부서</th><th>현황</th><th>영향 언어권</th><th>담당자</th><th>생성 일자</th></tr></thead>
      <tbody id="issue-rows"></tbody>
    </table></div>

    <div class="tlv" id="tl-wrap" hidden></div>
  </section>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-label="이슈 상세">
    <div class="dr-bar"><button class="x" id="dr-close" aria-label="닫기 (Esc)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></svg></button></div>
    <div class="detail" id="detail"></div>
  </aside>
</div>
